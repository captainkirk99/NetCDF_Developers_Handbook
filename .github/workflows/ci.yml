name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    name: Build and run examples (Ubuntu, apt netCDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install netCDF and HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libnetcdf-dev libhdf5-dev netcdf-bin
          nc-config --version

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Run examples
        run: ctest --test-dir build --output-on-failure
